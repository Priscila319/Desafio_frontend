<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Diário Pet</title>
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="text-center mb-4">
      <h1 class="mb-2">🐾 Diário Pet</h1>
      <p class="text-muted">Gestão de informações dos seus animais</p>
    </header>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 id="form-title" class="h4 mb-3">Novo Registro</h2>
        <form id="entry-form">
          <input type="hidden" id="entry-id" />

          <div class="mb-3">
            <label for="title" class="form-label">Nome do Pet</label>
            <input type="text" id="title" class="form-control" placeholder="Ex: Bob" required />
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Raça</label>
            <input type="text" id="description" class="form-control" placeholder="Ex: Labrador" required />
          </div>

          <div class="mb-3">
            <label for="happenedAt" class="form-label">Data de Nascimento</label>
            <input type="date" id="happenedAt" class="form-control" required />
          </div>

          <div class="d-flex gap-2 flex-wrap">
            <button type="submit" class="btn btn-primary">Salvar Registro</button>
            <button type="button" id="cancel-edit" class="btn btn-secondary d-none">Cancelar Edição</button>
          </div>
        </form>
        <p id="message" class="mt-3 mb-0 text-primary"></p>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">Pets Cadastrados</h2>
          <button id="reload-btn" class="btn btn-outline-secondary btn-sm">🔄 Atualizar</button>
        </div>
        <div id="entries-list"></div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
